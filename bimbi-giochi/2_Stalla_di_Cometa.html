<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La stalla di Cometa · Piccolo Villaggio Incantato</title><style>
:root{font-family:'Trebuchet MS',Verdana,sans-serif;color:#fff7e9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 15%,#254962,#091c31 78%);display:grid;place-items:center;padding:18px}.app{width:min(1100px,100%);position:relative;overflow:hidden;border:7px solid #765039;border-radius:27px;background:#1e3445;box-shadow:0 30px 85px #0009}.scene{height:min(67vw,620px);min-height:380px;position:relative;overflow:hidden;background:linear-gradient(#322e36 0 9%,#8a5c43 9% 12%,#69452f 12% 70%,#a47a4b 70% 100%)}.scene:before{content:"";position:absolute;inset:12% 0 30%;background:repeating-linear-gradient(0deg,transparent 0 63px,#3527197d 64px 68px),repeating-linear-gradient(90deg,transparent 0 170px,#3d2b1c85 171px 177px);opacity:.6}.beam{position:absolute;top:0;height:72%;width:22px;background:linear-gradient(90deg,#442817,#b27a48,#50301d);box-shadow:3px 0 7px #0006}.beam.left{left:8%}.beam.right{right:8%}.window{position:absolute;top:18%;right:12%;width:22%;height:33%;border:11px solid #4c2f21;border-radius:100px 100px 8px 8px;background:linear-gradient(#193d65,#6e9bb5 75%,#e6eff8 76%);box-shadow:inset 0 0 30px #e8effa70,0 0 35px #e9b86835}.window:after{content:"";position:absolute;inset:0;border-left:8px solid #4c2f21;left:49%;width:0}.snow{position:absolute;top:16%;right:12%;width:22%;height:35%;pointer-events:none;background-image:radial-gradient(white 1.5px,transparent 2px);background-size:27px 33px;opacity:.7;animation:drift 12s linear infinite}.lamp{position:absolute;top:6%;left:17%;width:65px;height:95px;background:radial-gradient(ellipse at center,#ffe6a1 0 26%,#d18e32 48%,#493022 75%);border:8px solid #583c29;border-radius:12px 12px 30px 30px;box-shadow:0 0 90px 40px #ffc76e38}.lamp:before{content:"";position:absolute;left:25px;top:-42px;height:38px;border-left:6px solid #2e2626}.hay{position:absolute;bottom:10%;left:5%;width:35%;height:13%;border-radius:50%;background:repeating-linear-gradient(145deg,#cda45c 0 5px,#9e713a 6px 9px);filter:drop-shadow(0 7px 6px #392818)}.hay.two{left:auto;right:2%;width:28%;bottom:12%}.floor{position:absolute;bottom:0;width:100%;height:25%;background:repeating-linear-gradient(92deg,#855a39 0 90px,#69432d 91px 97px);clip-path:polygon(0 12%,100% 12%,100% 100%,0 100%)}.rail{position:absolute;bottom:16%;left:0;width:100%;height:15px;background:linear-gradient(#d6a06a,#6a3d24);box-shadow:0 65px 0 #7e4b2a}.rail:before,.rail:after{content:"";position:absolute;width:16px;height:95px;top:0;background:#8a5531}.rail:before{left:6%}.rail:after{right:7%}.reindeer{position:absolute;width:min(55%,530px);height:87%;bottom:2%;left:50%;transform:translateX(-50%);filter:drop-shadow(0 16px 10px #30231a8a);cursor:pointer;touch-action:manipulation}.reindeer svg{width:100%;height:100%;overflow:visible}.head{transform-origin:260px 208px;animation:breathe 4s ease-in-out infinite}.earL,.earR{transform-box:fill-box;transform-origin:center;animation:ears 5s ease-in-out infinite}.eye{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}.tail{transform-origin:142px 325px;animation:tail 3s ease-in-out infinite}.reindeer.happy .head{animation:happy .5s ease-in-out 3}.reindeer.happy .tail{animation:tail .18s ease-in-out 10}.reindeer.eating .head{animation:eat .35s ease-in-out 5}.reindeer.brushed .head{animation:happy .65s ease-in-out 2}.spark{position:absolute;pointer-events:none;left:50%;top:40%;font-size:30px;animation:float 1.4s ease-out forwards}.bubble{position:absolute;left:50%;top:11%;transform:translateX(-50%);padding:10px 20px;background:#fff8e7;color:#543b2b;border:3px solid #c79755;border-radius:25px;font-size:clamp(14px,2.2vw,21px);font-weight:bold;box-shadow:0 6px 20px #0004;text-align:center;max-width:80%;z-index:3}.bubble:after{content:"";position:absolute;left:50%;bottom:-14px;border:7px solid transparent;border-top-color:#fff8e7}.top{position:absolute;top:13px;left:17px;z-index:5;padding:8px 15px;background:#183c46b9;border:1px solid #ffffff50;border-radius:25px;font-weight:bold;font-size:clamp(14px,2vw,20px)}.controls{background:linear-gradient(#264e55,#142d3d);padding:20px 16px 22px;text-align:center}.controls h1{font-size:clamp(22px,3.3vw,34px);margin:0 0 5px;color:#ffe4aa}.controls p{margin:0 0 15px;font-size:clamp(14px,1.9vw,18px)}.buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}button{border:0;border-bottom:5px solid #9e572e;border-radius:17px;padding:15px 19px;background:linear-gradient(#ffe9ae,#f6b96a);color:#49301e;font-size:clamp(15px,1.9vw,20px);font-weight:800;cursor:pointer;min-width:180px;transition:transform .15s}button:hover{transform:translateY(-3px)}button:active{transform:translateY(2px);border-bottom-width:2px}button:focus-visible{outline:4px solid white;outline-offset:3px}.progress{margin:14px auto 0;font-size:15px;color:#e5e9d6}.progress strong{color:#ffe5a0}.star{display:inline-block;filter:drop-shadow(0 0 6px #ffdf7b)}.tiny{font-size:13px;opacity:.8;margin-top:8px}@keyframes breathe{50%{transform:translateY(4px)}}@keyframes blink{0%,42%,46%,100%{transform:scaleY(1)}44%{transform:scaleY(.08)}}@keyframes ears{0%,87%,100%{transform:rotate(0)}91%{transform:rotate(-10deg)}95%{transform:rotate(8deg)}}@keyframes tail{50%{transform:rotate(10deg)}}@keyframes happy{25%{transform:rotate(-7deg) translateY(-7px)}75%{transform:rotate(7deg) translateY(-4px)}}@keyframes eat{50%{transform:rotate(7deg) translateY(12px)}}@keyframes float{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-125px) scale(1.5)}}@keyframes drift{to{background-position:30px 120px}}@media(max-width:650px){body{padding:5px}.app{border-width:4px;border-radius:16px}.scene{height:460px}.reindeer{width:90%;height:72%;bottom:5%}.bubble{top:15%;max-width:85%}.window{right:5%;width:29%}.snow{right:5%;width:29%}.buttons button{min-width:125px;flex:1;padding:13px 8px}.controls{padding:16px 8px}.lamp{transform:scale(.65);transform-origin:top left}}

/* Villaggio per bambini: schermo basso (telefono in orizzontale), Cometa a sinistra e i pulsanti a destra */
@media (max-height:900px) and (min-aspect-ratio:4/3){body{padding:6px;min-height:0;height:100vh}.app{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(220px,1fr);height:calc(100vh - 12px);border-width:4px;border-radius:16px}.scene{height:100%;min-height:0}.controls{display:flex;flex-direction:column;justify-content:center;padding:10px;overflow:auto}.controls h1{font-size:1.3rem}.controls p{font-size:.9rem;margin-bottom:8px}.buttons{flex-direction:column;gap:8px}.buttons button{min-width:0;min-height:44px;padding:8px 12px;font-size:1rem}.progress{margin-top:8px;font-size:13px}.tiny{display:none}.bubble{font-size:14px;top:5%}.top{display:none}}

/* Villaggio per bambini: telefono piccolo in verticale, il disegno si stringe e i pulsanti restano in vista */
@media (orientation:portrait) and (max-height:760px){body{padding:4px;min-height:0;height:100vh;display:block}.app{display:flex;flex-direction:column;height:calc(100vh - 8px)}.scene{height:auto;flex:1;min-height:0}.controls{padding:10px 8px}.controls h1{font-size:20px;margin:0 0 6px}.controls p{display:none}.buttons{gap:8px}.buttons button{padding:10px 8px;min-height:44px}.progress{margin-top:8px}.tiny{display:none}}

/* Villaggio per bambini: con "riduci movimento" le animazioni si fermano */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style></head><body><main class="app"><div class="scene" id="scene"><div class="beam left"></div><div class="beam right"></div><div class="window"></div><div class="snow"></div><div class="lamp"></div><div class="hay"></div><div class="hay two"></div><div class="floor"></div><div class="rail"></div><div class="top">🎄 La stalla delle renne</div><div class="bubble" id="bubble" aria-live="polite">Ciao! Io sono Cometa! 🦌</div><div class="reindeer" id="deer" role="button" tabindex="0" aria-label="Accarezza Cometa toccandola"><svg viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><radialGradient id="fur"><stop stop-color="#d9a36b"/><stop offset=".72" stop-color="#a96840"/><stop offset="1" stop-color="#76462f"/></radialGradient><radialGradient id="face"><stop stop-color="#eec396"/><stop offset="1" stop-color="#b9794b"/></radialGradient><linearGradient id="ant" x2="1" y2="1"><stop stop-color="#e4c398"/><stop offset="1" stop-color="#8c6042"/></linearGradient></defs><ellipse cx="255" cy="479" rx="135" ry="22" fill="#3d291b" opacity=".35"/><g class="tail"><ellipse cx="140" cy="320" rx="35" ry="20" fill="#a46c49" transform="rotate(-25 140 320)"/><ellipse cx="130" cy="314" rx="19" ry="10" fill="#f5d5a5" transform="rotate(-25 130 314)"/></g><ellipse cx="260" cy="335" rx="121" ry="112" fill="url(#fur)"/><ellipse cx="260" cy="365" rx="77" ry="76" fill="#f1d4ae"/><g fill="#8c5339" stroke="#68402f" stroke-width="3"><path d="M173 391 Q160 450 170 477 L214 477 Q224 443 214 405Z"/><path d="M305 398 Q296 446 306 477 L351 477 Q360 447 345 388Z"/></g><g fill="#554039"><rect x="166" y="469" width="50" height="20" rx="9"/><rect x="303" y="469" width="51" height="20" rx="9"/></g><g class="head"><path d="M207 161 Q185 114 172 66 Q152 41 146 48 Q143 59 166 85 L173 129 Q146 118 130 96 Q119 89 114 99 Q130 133 183 157Z" fill="url(#ant)" stroke="#79583f" stroke-width="7" stroke-linejoin="round"/><path d="M303 161 Q326 115 339 66 Q358 41 366 48 Q368 60 344 85 L337 129 Q366 117 379 96 Q391 89 397 99 Q377 135 325 157Z" fill="url(#ant)" stroke="#79583f" stroke-width="7" stroke-linejoin="round"/><g class="earL"><ellipse cx="181" cy="188" rx="45" ry="25" fill="#aa6d49" stroke="#75462e" stroke-width="5" transform="rotate(26 181 188)"/><ellipse cx="182" cy="188" rx="31" ry="14" fill="#edb0a3" transform="rotate(26 182 188)"/></g><g class="earR"><ellipse cx="339" cy="188" rx="45" ry="25" fill="#aa6d49" stroke="#75462e" stroke-width="5" transform="rotate(-26 339 188)"/><ellipse cx="338" cy="188" rx="31" ry="14" fill="#edb0a3" transform="rotate(-26 338 188)"/></g><ellipse cx="260" cy="233" rx="93" ry="99" fill="url(#face)" stroke="#8f5737" stroke-width="4"/><ellipse cx="260" cy="287" rx="68" ry="54" fill="#f6d6b6"/><ellipse cx="221" cy="239" rx="22" ry="26" fill="#fff8e8"/><ellipse cx="300" cy="239" rx="22" ry="26" fill="#fff8e8"/><g class="eye"><ellipse cx="224" cy="240" rx="11" ry="17" fill="#35231d"/><ellipse cx="303" cy="240" rx="11" ry="17" fill="#35231d"/><circle cx="228" cy="234" r="5" fill="white"/><circle cx="307" cy="234" r="5" fill="white"/></g><ellipse cx="260" cy="284" rx="29" ry="22" fill="#70433d"/><ellipse cx="253" cy="277" rx="11" ry="6" fill="#d49c8b" opacity=".8"/><path d="M247 314 Q261 325 275 314" fill="none" stroke="#765040" stroke-width="5" stroke-linecap="round"/><ellipse cx="194" cy="272" rx="16" ry="9" fill="#db8d7d" opacity=".5"/><ellipse cx="327" cy="272" rx="16" ry="9" fill="#db8d7d" opacity=".5"/><path d="M190 331 Q259 353 327 330 L338 359 Q258 382 181 356Z" fill="#b8303e" stroke="#842b35" stroke-width="5"/><path d="M304 357 L336 358 L346 432 Q328 446 313 425Z" fill="#d4414d" stroke="#a12d39" stroke-width="4"/><path d="M315 376 L338 376" stroke="#f3c0a0" stroke-width="5"/></g></svg></div></div><section class="controls"><h1>Conosci Cometa! 🦌</h1><p>Gioca con lei e scopri quanto è affettuosa.</p><div class="buttons"><button id="pet">🤲 Accarezza</button><button id="feed">🥕 Dai una carota</button><button id="brush">✨ Spazzola il pelo</button></div><div class="progress" id="progress" aria-live="polite"></div><div class="tiny">Puoi anche toccare direttamente Cometa!</div></section></main><script>
(()=>{'use strict';const deer=document.getElementById('deer'),bubble=document.getElementById('bubble'),scene=document.getElementById('scene'),progress=document.getElementById('progress');const key='piccolo-villaggio-cometa-v1';let done={pet:false,feed:false,brush:false};try{const x=JSON.parse(localStorage.getItem(key));if(x&&typeof x==='object')done={...done,...x}}catch(e){}let timer;function stars(){const count=['pet','feed','brush'].filter(x=>done[x]).length;progress.innerHTML=`<strong>${count} di 3 gesti gentili</strong> · ${'⭐'.repeat(count)}${'☆'.repeat(3-count)}${count===3?' · Cometa è felicissima! ❤️':''}`}function act(type){const messages={pet:'Che coccole! Ti voglio bene! ❤️',feed:'Mmm… che carota deliziosa! 🥕',brush:'Che bel pelo morbido! Grazie! ✨'};done[type]=true;try{localStorage.setItem(key,JSON.stringify(done))}catch(e){}stars();bubble.textContent=messages[type];deer.classList.remove('happy','eating','brushed');void deer.offsetWidth;deer.classList.add(type==='feed'?'eating':type==='brush'?'brushed':'happy');const s=document.createElement('span');s.className='spark';s.textContent=type==='feed'?'🥕':type==='brush'?'✨':'❤️';s.style.left=(43+Math.random()*14)+'%';scene.appendChild(s);setTimeout(()=>s.remove(),1450);clearTimeout(timer);timer=setTimeout(()=>{deer.classList.remove('happy','eating','brushed');bubble.textContent=Object.values(done).every(Boolean)?'Sei il mio amico speciale! 🌟':'Vuoi giocare ancora con me? 🦌'},2100)}document.getElementById('pet').onclick=()=>act('pet');document.getElementById('feed').onclick=()=>act('feed');document.getElementById('brush').onclick=()=>act('brush');deer.onclick=()=>act('pet');deer.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act('pet')}};stars()})();
</script></body></html>

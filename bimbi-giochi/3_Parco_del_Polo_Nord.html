<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Il Parco del Polo Nord</title><style>
:root{font-family:'Trebuchet MS',system-ui,sans-serif;color:#193b57}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#a9d8f2,#e8f8ff);display:grid;place-items:center;padding:14px}.app{width:min(100%,1040px);background:#f5fcff;border:5px solid #fff;border-radius:28px;box-shadow:0 18px 60px #24557755;overflow:hidden}header{text-align:center;padding:17px 12px 9px;background:#f5fcff}h1{margin:0;font-size:clamp(24px,4vw,38px);color:#174967}header p{margin:6px;color:#52718b}.scene{position:relative;height:min(58vw,530px);min-height:330px;overflow:hidden;background:linear-gradient(#64b5df 0%,#b7e4f5 53%,#edfaff 54%,#fff 100%)}.aurora{position:absolute;inset:-40% -10% 32%;background:radial-gradient(ellipse at 50% 100%,#b8f9dc99,transparent 60%);transform:rotate(-10deg);pointer-events:none}.mountains{position:absolute;inset:30% 0 22%;background:#b5dbe9;clip-path:polygon(0 80%,10% 40%,21% 72%,33% 12%,47% 73%,62% 32%,76% 75%,90% 21%,100% 68%,100% 100%,0 100%)}.mountains:after{content:'';position:absolute;inset:14% 0 0;background:#eafaff;clip-path:polygon(0 86%,10% 52%,21% 85%,33% 27%,47% 83%,62% 46%,76% 88%,90% 36%,100% 80%,100% 100%,0 100%)}.ice{position:absolute;left:6%;right:6%;bottom:5%;height:37%;background:linear-gradient(145deg,#e3faff,#9ed9ec 65%,#d9f7ff);border:7px solid #f8ffff;border-radius:55% 48% 45% 55%;box-shadow:inset 0 12px 22px #69b3d555,0 7px 10px #6fa9c433}.ice:after{content:'';position:absolute;left:15%;top:27%;width:56%;height:30%;border-top:3px solid #ffffffaa;border-radius:50%;transform:rotate(-8deg)}.snow{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1.5px,transparent 2px),radial-gradient(#fff 2px,transparent 3px);background-size:67px 79px,107px 91px;background-position:9px 14px,44px 31px;opacity:.7;animation:fall 14s linear infinite}@keyframes fall{to{background-position:9px 490px,44px 580px}}.animal{position:absolute;display:block;transform-origin:bottom center;filter:drop-shadow(0 10px 5px #32678c44)}.penguin{width:clamp(68px,12vw,132px);bottom:14%;left:25%;transition:left 1.5s ease,bottom 1.5s ease;animation:wobble 2.7s ease-in-out infinite}.penguin.two{left:45%;bottom:13%;width:clamp(55px,10vw,105px);animation-delay:-1.1s}.penguin.three{left:63%;bottom:16%;width:clamp(48px,9vw,94px);animation-delay:-1.8s}.bear{width:clamp(130px,24vw,250px);left:2%;bottom:17%;animation:breathe 3s ease-in-out infinite;cursor:pointer}.seal{width:clamp(85px,14vw,150px);right:3%;bottom:19%;animation:breathe 3.5s ease-in-out infinite;cursor:pointer}.animal svg{display:block;width:100%;height:auto}.penguin.slide{animation:slide 2.4s ease-in-out 1!important}.bear.wave{animation:standup 2.5s ease-in-out 1!important}.bear .upright{opacity:0;transition:opacity .3s}.bear.wave .upright{opacity:1;transition:opacity .3s .3s}.bear.wave .sitting{opacity:0;transition:opacity .3s .3s}.seal.jump{animation:sealjump 2.5s ease-in-out 1!important}@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}@keyframes breathe{50%{transform:translateY(-5px) scale(1.02)}}@keyframes slide{0%{transform:translateX(0) rotate(0)}35%{transform:translateX(30px) rotate(20deg)}65%{transform:translateX(-22px) rotate(-12deg)}100%{transform:translateX(0) rotate(0)}}@keyframes wave{25%,75%{transform:rotate(-5deg) translateY(-9px)}50%{transform:rotate(5deg) translateY(-14px)}}@keyframes standup{0%,100%{transform:translateY(0)}20%,75%{transform:translateY(-10px)}40%,60%{transform:translateY(-17px)}}@keyframes sealjump{0%,100%{transform:translateY(0) rotate(0)}18%{transform:translateY(-58px) rotate(-12deg)}32%{transform:translateY(0) rotate(0)}50%{transform:translateY(-85px) rotate(10deg)}67%{transform:translateY(0) rotate(0)}82%{transform:translateY(-38px) rotate(-7deg)}}@keyframes pawwave{0%,100%{transform:rotate(0)}50%{transform:rotate(24deg)}}.bear.wave .wavepaw{transform-origin:168px 108px;animation:pawwave .55s ease-in-out 3 .65s}.spark{position:absolute;inset:0;pointer-events:none;overflow:hidden}.star{position:absolute;font-size:25px;animation:pop 1.2s forwards}@keyframes pop{0%{opacity:0;transform:scale(.3) translateY(0)}40%{opacity:1}100%{opacity:0;transform:scale(1.5) translateY(-70px)}}.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:18px;background:#eaf8ff}button{font:700 17px 'Trebuchet MS',sans-serif;border:0;border-radius:20px;background:#267fb0;color:white;padding:14px 19px;box-shadow:0 5px 0 #165c84;cursor:pointer;min-height:55px}button:active{transform:translateY(4px);box-shadow:0 1px 0 #165c84}button:focus-visible{outline:4px solid #ffba42;outline-offset:3px}.message{text-align:center;min-height:53px;padding:9px 15px 16px;background:#eaf8ff;font-size:18px;font-weight:bold}.progress{text-align:center;background:#f5fcff;padding:12px;color:#55758a;font-size:14px}.progress strong{color:#17648d}@media(max-width:550px){.scene{min-height:340px}.bear{left:-4%;bottom:23%}.seal{right:-6%;bottom:24%}.penguin{bottom:11%}.penguin.two{bottom:12%}.penguin.three{bottom:12%}button{font-size:15px;padding:12px}.controls{gap:9px}}

/* Villaggio per bambini: schermo basso (telefono in orizzontale), gli animali a sinistra e i pulsanti a destra */
@media (max-height:900px) and (min-aspect-ratio:4/3){body{padding:6px;min-height:0;height:100vh}.app{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(220px,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;height:calc(100vh - 12px);border-width:3px;border-radius:16px}.scene{grid-column:1;grid-row:1/5;height:100%;min-height:0}header{grid-column:2;grid-row:1;padding:6px 8px 2px}header h1{font-size:1.15rem}header p{display:none}.controls{grid-column:2;grid-row:2;flex-direction:column;padding:6px 10px;gap:6px}.controls button{min-height:44px;padding:6px 10px;font-size:.95rem}.message{grid-column:2;grid-row:3;font-size:.9rem;min-height:0;padding:4px 10px;overflow:auto}.progress{grid-column:2;grid-row:4;padding:4px;font-size:12px}}

/* Villaggio per bambini: telefono piccolo in verticale, il disegno si stringe e i pulsanti restano in vista */
@media (orientation:portrait) and (max-height:760px){body{padding:4px;min-height:0;height:100vh;display:block}.app{display:flex;flex-direction:column;height:calc(100vh - 8px);border-width:3px}header{padding:8px 8px 4px}header h1{font-size:22px}header p{display:none}.scene{flex:1;height:auto;min-height:0}.controls{padding:8px;gap:6px}.controls button{min-height:44px;padding:8px 10px;font-size:14px}.message{min-height:0;padding:6px 10px;font-size:15px}.progress{padding:6px;font-size:12px}}

/* Villaggio per bambini: con "riduci movimento" le animazioni si fermano */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style></head><body><main class="app"><header><h1>❄️ Il Parco del Polo Nord ❄️</h1><p>Un piccolo mondo di ghiaccio pieno di amici!</p></header><section class="scene" aria-label="Paesaggio artico con tre pinguini, un orso polare e una foca"><div class="aurora"></div><div class="mountains"></div><div class="ice"></div><div class="snow"></div><div class="animal bear" id="bear" role="img" aria-label="Orso polare" tabindex="0"><svg viewBox="0 0 250 205" xmlns="http://www.w3.org/2000/svg"><g class="sitting"><ellipse cx="126" cy="183" rx="96" ry="13" fill="#8db9cf" opacity=".45"/><ellipse cx="128" cy="133" rx="95" ry="59" fill="#f6fcff" stroke="#d0e7ee" stroke-width="4"/><ellipse cx="63" cy="164" rx="30" ry="20" fill="#f7fcff" stroke="#d0e7ee" stroke-width="3"/><ellipse cx="197" cy="164" rx="31" ry="20" fill="#f7fcff" stroke="#d0e7ee" stroke-width="3"/><circle cx="125" cy="75" r="65" fill="#fff" stroke="#d1e7ee" stroke-width="4"/><circle cx="80" cy="27" r="20" fill="#fff" stroke="#d1e7ee" stroke-width="4"/><circle cx="170" cy="27" r="20" fill="#fff" stroke="#d1e7ee" stroke-width="4"/><circle cx="80" cy="27" r="10" fill="#efb8c1"/><circle cx="170" cy="27" r="10" fill="#efb8c1"/><ellipse cx="103" cy="75" rx="7" ry="9" fill="#223a4c"/><ellipse cx="149" cy="75" rx="7" ry="9" fill="#223a4c"/><ellipse cx="126" cy="106" rx="30" ry="24" fill="#e6f2f7"/><ellipse cx="126" cy="99" rx="12" ry="9" fill="#273e4b"/><path d="M114 116Q126 129 138 116" stroke="#354a56" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="88" cy="103" r="10" fill="#f4b6bd" opacity=".5"/><circle cx="164" cy="103" r="10" fill="#f4b6bd" opacity=".5"/><path d="M54 115Q30 92 25 120Q20 149 55 154" fill="#fff" stroke="#d0e7ee" stroke-width="4"/><path d="M201 115Q225 92 230 120Q235 149 200 154" fill="#fff" stroke="#d0e7ee" stroke-width="4"/></g><g class="upright"><ellipse cx="125" cy="192" rx="73" ry="10" fill="#8db9cf" opacity=".45"/><ellipse cx="94" cy="179" rx="30" ry="16" fill="#fff" stroke="#d0e7ee" stroke-width="3"/><ellipse cx="158" cy="179" rx="30" ry="16" fill="#fff" stroke="#d0e7ee" stroke-width="3"/><ellipse cx="125" cy="127" rx="68" ry="66" fill="#f6fcff" stroke="#d0e7ee" stroke-width="4"/><path d="M69 104 Q38 96 33 135 Q39 155 63 143 L87 115" fill="#fff" stroke="#d0e7ee" stroke-width="4"/><g class="wavepaw"><path d="M173 106 Q202 74 215 48 Q238 39 234 67 Q228 110 192 139Z" fill="#fff" stroke="#d0e7ee" stroke-width="4"/><ellipse cx="222" cy="53" rx="10" ry="13" fill="#f5cbd0"/></g><circle cx="125" cy="58" r="53" fill="#fff" stroke="#d0e7ee" stroke-width="4"/><circle cx="88" cy="20" r="16" fill="#fff" stroke="#d0e7ee" stroke-width="4"/><circle cx="162" cy="20" r="16" fill="#fff" stroke="#d0e7ee" stroke-width="4"/><circle cx="88" cy="20" r="8" fill="#efb8c1"/><circle cx="162" cy="20" r="8" fill="#efb8c1"/><ellipse cx="107" cy="57" rx="6" ry="8" fill="#223a4c"/><ellipse cx="144" cy="57" rx="6" ry="8" fill="#223a4c"/><ellipse cx="125" cy="80" rx="24" ry="19" fill="#e6f2f7"/><ellipse cx="125" cy="73" rx="10" ry="8" fill="#273e4b"/><path d="M115 89 Q125 100 135 89" stroke="#354a56" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="93" cy="78" r="8" fill="#f4b6bd" opacity=".5"/><circle cx="158" cy="78" r="8" fill="#f4b6bd" opacity=".5"/></g></svg></div><div class="animal penguin" id="p1"></div><div class="animal penguin two" id="p2"></div><div class="animal penguin three" id="p3"></div><div class="animal seal" id="seal" role="img" aria-label="Foca" tabindex="0"><svg viewBox="0 0 180 155" xmlns="http://www.w3.org/2000/svg"><ellipse cx="91" cy="141" rx="77" ry="10" fill="#72b2d1" opacity=".5"/><path d="M23 115Q0 101 12 83Q32 79 49 102Q59 49 110 48Q161 45 167 111Q173 139 96 139Q41 141 23 115Z" fill="#9babbc" stroke="#708a9d" stroke-width="4"/><ellipse cx="106" cy="76" rx="51" ry="51" fill="#aebdca"/><ellipse cx="85" cy="69" rx="6" ry="8" fill="#243b4b"/><ellipse cx="131" cy="69" rx="6" ry="8" fill="#243b4b"/><ellipse cx="108" cy="94" rx="23" ry="16" fill="#dce6ed"/><ellipse cx="108" cy="87" rx="10" ry="7" fill="#344655"/><path d="M98 103Q108 113 118 103" stroke="#45586b" stroke-width="3" fill="none"/><path d="M85 96L60 90M85 103L59 107M130 96L151 90M130 103L151 108" stroke="#e8f5fa" stroke-width="2"/><path d="M45 111Q12 100 7 123Q20 146 59 133" fill="#8d9fb0" stroke="#708a9d" stroke-width="3"/></svg></div><div class="spark" id="spark"></div></section><div class="controls"><button id="slide">🐧 Fai scivolare i pinguini</button><button id="hello">🐻‍❄️ Saluta l'orso</button><button id="play">🦭 Fai saltellare la foca</button></div><div class="message" id="message" aria-live="polite">Tocca un animale o scegli un gioco!</div><div class="progress" id="progress">Piccole scoperte: <strong>0 di 3</strong></div></main><script>
const penguin=`<svg viewBox="0 0 120 165" xmlns="http://www.w3.org/2000/svg"><ellipse cx="60" cy="153" rx="50" ry="9" fill="#6da8c8" opacity=".4"/><ellipse cx="60" cy="85" rx="45" ry="68" fill="#263c50"/><ellipse cx="60" cy="95" rx="32" ry="53" fill="#fff9f3"/><path d="M23 77Q-4 95 14 118L31 102" fill="#263c50"/><path d="M97 77Q124 95 106 118L89 102" fill="#263c50"/><circle cx="45" cy="56" r="7" fill="#fff"/><circle cx="75" cy="56" r="7" fill="#fff"/><circle cx="46" cy="57" r="4" fill="#263c50"/><circle cx="74" cy="57" r="4" fill="#263c50"/><path d="M48 72L60 84L72 72Z" fill="#efaa3b"/><ellipse cx="39" cy="148" rx="22" ry="9" fill="#eead4e"/><ellipse cx="81" cy="148" rx="22" ry="9" fill="#eead4e"/><ellipse cx="32" cy="78" rx="10" ry="7" fill="#f3aeb4" opacity=".7"/><ellipse cx="88" cy="78" rx="10" ry="7" fill="#f3aeb4" opacity=".7"/></svg>`;for(let i=1;i<=3;i++)document.getElementById('p'+i).innerHTML=penguin;
let done=new Set();try{done=new Set(JSON.parse(localStorage.getItem('poloScoperte')||'[]'))}catch(e){}const msg=document.getElementById('message');function update(){document.getElementById('progress').innerHTML=`Piccole scoperte: <strong>${done.size} di 3</strong>${done.size===3?' · 🎉 Hai conosciuto tutti gli amici del Polo Nord!':''}`;}update();let busy={};function animate(ids,cls,key,words){if(busy[key])return;busy[key]=true;ids.forEach(id=>{const el=document.getElementById(id);el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)});done.add(key);try{localStorage.setItem('poloScoperte',JSON.stringify([...done]))}catch(e){}update();msg.textContent=words;stars();setTimeout(()=>{ids.forEach(id=>document.getElementById(id).classList.remove(cls));busy[key]=false},2500)}function stars(){const holder=document.getElementById('spark');for(let i=0;i<9;i++){const s=document.createElement('span');s.className='star';s.textContent='✦';s.style.left=(12+Math.random()*76)+'%';s.style.top=(40+Math.random()*45)+'%';s.style.color=['#fff','#ffe2a3','#a4f4e6'][i%3];holder.append(s);setTimeout(()=>s.remove(),1300)}}document.getElementById('slide').onclick=()=>animate(['p1','p2','p3'],'slide','pinguini','Che scivolata! I tre pinguini giocano sul ghiaccio! 🐧');document.getElementById('hello').onclick=()=>animate(['bear'],'wave','orso','L’orso si alza in piedi e ti saluta con una zampa! 🐻‍❄️');document.getElementById('play').onclick=()=>animate(['seal'],'jump','foca','La foca saltella felice per giocare con te! 🦭');for(const [id,button] of [['bear','hello'],['seal','play']]){const el=document.getElementById(id);el.onclick=()=>document.getElementById(button).click();el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}}
</script></body></html>

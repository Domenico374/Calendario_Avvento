<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Costruiamo un amico di neve</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c2443;color:#26344b;font-family:'Trebuchet MS',system-ui,sans-serif}main{max-width:1040px;margin:16px auto;padding:0 12px}.shell{border:5px solid #f5d899;border-radius:28px;overflow:hidden;background:#fff8e8;box-shadow:0 22px 70px #0007}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;background:#fff8e8}.head h1{font-size:clamp(1.25rem,3.5vw,2rem);margin:0;color:#9d3548}.head span{font-size:.85rem;color:#586b7d}.stage{position:relative;aspect-ratio:16/10;background:#b8d6ed;overflow:hidden}.stage svg{display:block;width:100%;height:100%}.panel{padding:15px 18px 22px;text-align:center;background:#fff8e8}.instruction{font-size:clamp(1rem,2.5vw,1.3rem);font-weight:bold;margin:0 0 12px}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}button{font:700 1rem 'Trebuchet MS',system-ui;cursor:pointer;border:2px solid #a33d48;background:#ac394c;color:white;border-radius:999px;padding:12px 18px;min-height:49px;box-shadow:0 4px 0 #702532}button:hover{background:#c44c60}button:focus-visible{outline:3px solid #194f7a;outline-offset:3px}.secondary{background:#fff;color:#81303f}.foot{font-size:.8rem;color:#5e6a75;margin:14px 0 0}.snow{animation:fall 12s linear infinite}@keyframes fall{to{transform:translate(0,610px)}}.bob{animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-9px)}}.wink{transform-origin:center;animation:wink 5s infinite}@keyframes wink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.12)}}.part{opacity:0;transform:translateY(35px) scale(.8);transform-origin:center;transition:opacity .5s,transform .6s cubic-bezier(.18,1.5,.4,1)}.part.show{opacity:1;transform:none}.finish .snowman{animation:bob 2s ease-in-out infinite;transform-origin:450px 450px}.star{animation:twinkle 1.4s infinite alternate}@keyframes twinkle{to{opacity:.25;transform:scale(.7)}}@media(max-width:620px){main{margin:0;padding:0}.shell{border:0;border-radius:0}.stage{aspect-ratio:4/5}.head{padding:13px}.head span{display:none}.panel{padding:12px}button{font-size:.94rem;padding:10px 14px}}

/* Villaggio per bambini: schermo basso (telefono in orizzontale), il pupazzo a sinistra e i pulsanti a destra */
@media (max-height:900px) and (min-aspect-ratio:4/3){main{max-width:none;margin:0;padding:6px;height:100vh}.shell{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(220px,1fr);grid-template-rows:auto minmax(0,1fr);height:100%;border-width:3px;border-radius:16px}.head{grid-column:1/3;padding:6px 14px}.head h1{font-size:1.15rem}.head span{display:none}.stage{aspect-ratio:auto;min-height:0}.panel{display:flex;flex-direction:column;justify-content:center;padding:10px;overflow:auto}.foot{display:none}}

/* Villaggio per bambini: telefono piccolo in verticale, il disegno si stringe e i pulsanti restano in vista */
@media (orientation:portrait) and (max-height:760px){main{margin:0;padding:0;height:100vh}.shell{display:flex;flex-direction:column;height:100%;border:0;border-radius:0}.head{padding:8px 12px}.head h1{font-size:1.1rem}.stage{aspect-ratio:auto;flex:1;min-height:0}.panel{padding:10px}.foot{display:none}}

/* Villaggio per bambini: con "riduci movimento" le animazioni si fermano */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style></head><body><main><div class="shell"><header class="head"><h1>☃️ Costruiamo un amico di neve!</h1><span>Una piccola avventura nel Villaggio Incantato</span></header><div class="stage"><svg id="scene" viewBox="0 0 900 560" role="img" aria-label="Paesaggio invernale con un pupazzo di neve che si costruisce passo dopo passo" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#204c79"/><stop offset="1" stop-color="#b5dcef"/></linearGradient><radialGradient id="snowball" cx="35%" cy="22%" r="78%"><stop stop-color="#fff"/><stop offset=".58" stop-color="#f3fbff"/><stop offset="1" stop-color="#b7d4e8"/></radialGradient><linearGradient id="tree" x2="1" y2="1"><stop stop-color="#216d68"/><stop offset="1" stop-color="#0d3b49"/></linearGradient><radialGradient id="glow"><stop stop-color="#ffe5a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffe5a0" stop-opacity="0"/></radialGradient><filter id="shadow"><feGaussianBlur stdDeviation="7"/></filter></defs><rect width="900" height="560" fill="url(#sky)"/><circle cx="718" cy="125" r="112" fill="url(#glow)"/><circle cx="718" cy="125" r="32" fill="#fff5ce"/><path d="M0 370 Q180 275 340 350 Q540 290 900 365V560H0Z" fill="#d9edf6"/><path d="M0 430 Q210 355 420 420 Q640 350 900 430V560H0Z" fill="#effaff"/><path d="M0 515Q400 455 900 505V560H0Z" fill="#fff"/><g opacity=".9"><path d="M38 360l55-132 56 132Z" fill="url(#tree)"/><path d="M42 318l51-133 51 133Z" fill="url(#tree)"/><path d="M43 284l50-133 50 133Z" fill="url(#tree)"/><path d="M42 284Q94 307 143 284M42 318Q94 340 144 318M38 360Q94 379 149 360" fill="none" stroke="#e5f5ff" stroke-width="13" stroke-linecap="round"/><rect x="85" y="360" width="16" height="42" fill="#634a45"/></g><g transform="translate(758 85) scale(.83)"><path d="M0 270l75-150 75 150Z" fill="#16535a"/><path d="M5 230l70-158 70 158Z" fill="#1b6062"/><path d="M8 183L75 22l67 161Z" fill="#23736d"/><path d="M8 184Q75 202 142 184M5 230Q75 246 145 230M0 270Q75 288 150 270" stroke="#e9f8ff" stroke-width="15" fill="none" stroke-linecap="round"/></g><g transform="translate(230 298)"><path d="M0 65V0L55-40 115 0v65Z" fill="#9e6657"/><path d="M-10 5l65-60 70 60" stroke="#fff5e8" stroke-width="15" fill="none" stroke-linecap="round"/><rect x="46" y="20" width="26" height="45" rx="3" fill="#4d3440"/><rect x="10" y="12" width="23" height="25" fill="#ffe8a1"/><path d="M20 12v25M10 25h23" stroke="#c18a50" stroke-width="3"/><ellipse cx="22" cy="24" rx="40" ry="43" fill="url(#glow)"/></g><ellipse cx="465" cy="498" rx="185" ry="30" fill="#6e94ad" opacity=".22" filter="url(#shadow)"/><g class="snowman" id="snowman"><g id="base" class="part"><ellipse cx="450" cy="441" rx="115" ry="107" fill="url(#snowball)" stroke="#d2e9f4" stroke-width="3"/><path d="M369 404q-16 34-9 67" fill="none" stroke="white" stroke-width="11" stroke-linecap="round" opacity=".8"/></g><g id="middle" class="part"><circle cx="450" cy="319" r="84" fill="url(#snowball)" stroke="#d2e9f4" stroke-width="3"/><path d="M398 281q-13 19-12 37" fill="none" stroke="white" stroke-width="9" stroke-linecap="round" opacity=".8"/></g><g id="head" class="part"><circle cx="450" cy="209" r="67" fill="url(#snowball)" stroke="#d2e9f4" stroke-width="3"/><path d="M413 180q-9 11-9 21" fill="none" stroke="white" stroke-width="8" stroke-linecap="round"/></g><g id="face" class="part"><ellipse cx="427" cy="199" rx="7" ry="9" fill="#293644" class="wink"/><ellipse cx="472" cy="199" rx="7" ry="9" fill="#293644"/><circle cx="413" cy="218" r="10" fill="#f5a6aa" opacity=".6"/><circle cx="489" cy="218" r="10" fill="#f5a6aa" opacity=".6"/><path d="M425 235q24 24 50-1" stroke="#5a4a44" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M450 212l49 10-49 10Z" fill="#ed833e" stroke="#d26a30" stroke-width="2"/></g><g id="arms" class="part" stroke="#79503c" stroke-width="9" fill="none" stroke-linecap="round"><path d="M379 318l-77-55-14-40m14 40-37-8m37 8 2-37M520 318l76-55 12-39m-12 39 36-10m-36 10-2-36"/></g><g id="scarf" class="part"><path d="M398 262q53 31 105 0l-8 23q-45 25-90 0Z" fill="#c43c4d" stroke="#9d283d" stroke-width="3"/><path d="M485 277l32 13-22 76-31-12Z" fill="#c43c4d"/><path d="M473 347l25 8m-22-2 25 7" stroke="#f9d9b2" stroke-width="4"/><circle cx="451" cy="331" r="6" fill="#35465a"/><circle cx="451" cy="365" r="6" fill="#35465a"/><circle cx="451" cy="397" r="6" fill="#35465a"/></g><g id="hat" class="part"><path d="M399 167l12-90q42-17 81 0l10 90Z" fill="#3a475d"/><path d="M405 143h94v18h-94Z" fill="#c94357"/><ellipse cx="452" cy="164" rx="79" ry="14" fill="#303a4c"/><ellipse cx="452" cy="160" rx="79" ry="9" fill="#455268"/></g></g><g id="sparkles" opacity="0"><path d="M320 185l7 19 18 7-18 7-7 19-7-19-18-7 18-7ZM568 250l5 14 14 5-14 5-5 14-5-14-14-5 14-5Z" fill="#ffe49b"/><circle cx="570" cy="142" r="5" fill="#fff"/><circle cx="310" cy="340" r="5" fill="#fff"/></g><g id="flakes" fill="white" opacity=".7"><circle cx="175" cy="80" r="4"/><circle cx="260" cy="165" r="3"/><circle cx="580" cy="85" r="4"/><circle cx="700" cy="300" r="3"/><circle cx="830" cy="225" r="4"/><circle cx="65" cy="185" r="4"/><circle cx="175" cy="260" r="3"/><circle cx="645" cy="400" r="4"/></g></svg></div><div class="panel"><p class="instruction" id="instruction" aria-live="polite">Fiocco ha trovato una grande palla di neve! La mettiamo qui?</p><div class="actions" id="actions"><button id="next">Metti la prima palla di neve</button></div><p class="foot">Un gioco di prova: niente punti, niente fretta. Ogni pezzo appare davvero nel paesaggio.</p></div></div></main><script>
(()=>{'use strict';const steps=[['base','Metti la prima palla di neve','Bravo! Ora aggiungiamo la seconda.'],['middle','Aggiungi il pancione','Che bello! Manca la testolina.'],['head','Metti la testa','Adesso gli facciamo un bel viso!'],['face','Occhi, sorriso e carota','Che simpatico! Gli servono le braccia.'],['arms','Aggiungi i rametti','Brrr! Mettiamogli una sciarpa.'],['scarf','Metti la sciarpa rossa','E per finire… un cappello!'],['hat','Metti il cappello','Evviva! Il nostro amico di neve è vivo e balla!']];const key='piccolo-villaggio-pupazzo-prova-v1';let step=0;const button=document.getElementById('next'),instruction=document.getElementById('instruction'),stage=document.querySelector('.stage'),sparkles=document.getElementById('sparkles');function render(){steps.forEach(([id],i)=>document.getElementById(id).classList.toggle('show',i<step));if(step===steps.length){stage.classList.add('finish');sparkles.setAttribute('opacity','1');instruction.textContent='Evviva! Il nostro amico di neve è vivo e balla!';button.textContent='Ricostruiamo il pupazzo';button.classList.add('secondary')}else{stage.classList.remove('finish');sparkles.setAttribute('opacity','0');instruction.textContent=step===0?'Fiocco ha trovato una grande palla di neve! La mettiamo qui?':steps[step-1][2];button.textContent=steps[step][1];button.classList.remove('secondary')}}try{step=Math.max(0,Math.min(steps.length,Number(localStorage.getItem(key))||0))}catch(e){}render();button.addEventListener('click',()=>{step=step===steps.length?0:step+1;try{localStorage.setItem(key,String(step))}catch(e){}render()})})();
</script></body></html>

<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ufficio Postale del Villaggio Incantato</title><style>
:root{font-family:Trebuchet MS,Arial,sans-serif;color:#54301e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#fff4d7,#a9d2dd 68%,#6d9ba9);padding:18px}.app{max-width:1050px;margin:auto;background:#fff8e8;border:8px solid #a45a34;border-radius:28px;box-shadow:0 15px 50px #193f5480;overflow:hidden}.top{background:linear-gradient(130deg,#773b25,#b36c36);color:#fff3c8;text-align:center;padding:18px 12px;border-bottom:6px solid #e9b96d}.top h1{margin:0;font-size:clamp(26px,4vw,45px);text-shadow:2px 3px #502b1b}.top p{margin:6px}.scene{position:relative;min-height:330px;background:linear-gradient(90deg,#8e4b2f 0 3%,#c88c51 3% 97%,#8e4b2f 97%);display:flex;align-items:end;justify-content:space-around;padding:25px 15px 35px;gap:12px;overflow:hidden}.scene:before{content:'';position:absolute;top:0;left:0;right:0;height:18px;background:repeating-linear-gradient(90deg,#63371f 0 70px,#9c5731 70px 78px)}.window{position:absolute;left:33%;top:30px;width:32%;height:155px;border:12px solid #79492c;border-radius:75px 75px 10px 10px;background:linear-gradient(#172e65,#b5dafa);box-shadow:inset 0 -23px #f3faff}.window:after{content:'❄️  ✨  ❄️';position:absolute;top:35px;left:12%;font-size:27px}.elf,.mailbox,.desk{z-index:1}.elf{width:clamp(120px,25vw,230px);flex:0 1 auto;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(3px 9px 3px #52331c80);animation:bob 3s infinite}.fiocco-svg{display:block;width:100%;height:auto;max-height:260px}.elf-name{font-size:clamp(12px,1.7vw,18px);font-weight:900;color:#fff4da;text-shadow:1px 2px 3px #58321f;text-align:center;white-space:nowrap}.wave{transform-origin:179px 205px;animation:elfWave 3.8s ease-in-out infinite}@keyframes elfWave{0%,55%,100%{transform:rotate(0deg)}65%,83%{transform:rotate(-17deg)}74%,92%{transform:rotate(7deg)}}.mailbox{font-size:clamp(100px,16vw,160px);cursor:pointer;filter:drop-shadow(3px 8px 3px #52331c70)}.desk{background:linear-gradient(#bd7c40,#874626);border:7px solid #704022;border-radius:16px;width:34%;min-height:160px;text-align:center;padding:12px;box-shadow:0 9px 0 #4c2b1b}.desk .letter{font-size:clamp(58px,9vw,105px);display:block;transition:transform .5s}.desk .letter.fly{transform:translate(290px,-75px) rotate(25deg) scale(.15);opacity:0}.desk small{color:#fff3cf;font-size:18px;font-weight:bold}.steps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px;background:#ead0a5}.step{background:#fff7e7;border-radius:30px;padding:9px 15px;font-weight:bold;border:2px solid #b87842}.step.on{background:#31734d;color:white;border-color:#185b34}.panel{padding:22px;min-height:270px;text-align:center}h2{font-size:clamp(23px,3vw,31px);margin:4px 0 15px}.hint{font-size:18px}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:13px;margin:16px auto}.choice{border:3px solid #d2ad78;border-radius:18px;background:#fff;min-width:130px;padding:12px;cursor:pointer;font-size:18px}.choice .emoji{display:block;font-size:66px}.choice.selected{border-color:#26874b;background:#e2ffe9}.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:17px}button{font:inherit;cursor:pointer}button.action{border:0;border-radius:30px;background:#b6292c;color:white;padding:15px 26px;font-weight:bold;font-size:19px;box-shadow:0 5px #791b22}button.action:disabled{opacity:.5;cursor:not-allowed}button.secondary{border:2px solid #96683d;border-radius:30px;background:#fff8e8;padding:12px 20px;font-weight:bold}.paper{background:#fffdf5;border:8px solid transparent;border-image:repeating-linear-gradient(45deg,#b32931 0 12px,#fff 12px 24px,#2864a5 24px 36px,#fff 36px 48px) 8;max-width:550px;min-height:170px;margin:12px auto;padding:18px;text-align:left;font-size:21px;box-shadow:0 8px 20px #67401f35}.paper textarea{width:100%;font:inherit;border:1px dashed #c2a27c;padding:8px;border-radius:7px;resize:vertical}.stickers{font-size:38px;margin-top:10px}.sticker{font-size:38px;background:white;border:2px solid #d4b485;border-radius:15px;cursor:pointer;padding:8px}.big{font-size:90px;display:block;animation:bob 2s infinite}.status{font-size:22px;font-weight:bold;color:#216342}.foot{text-align:center;padding:13px;background:#f2d8a9;color:#724322}@keyframes bob{50%{transform:translateY(-9px)}}@keyframes fly{to{transform:translate(180px,-120px) scale(.3);opacity:0}}@media(max-width:600px){.fiocco-svg{max-height:190px}.elf-name{white-space:normal}.scene{min-height:255px}.window{height:115px}.desk{width:38%;min-height:125px;padding:8px}.desk small{font-size:13px}.choice{min-width:95px}.choice .emoji{font-size:52px}.paper{font-size:18px}}

/* Villaggio per bambini: la letterina di Babbo Natale, la nota gentile e i pulsanti sempre in vista */
.babbo-bar{text-align:center;padding:10px;background:#ead0a5;border-top:2px solid #d2ad78}.babbo-bar[hidden]{display:none}
.carta-babbo{white-space:pre-line}
.nota-gentile{max-width:520px;margin:12px auto;padding:12px 16px;border-radius:16px;background:#fff1cf;border:2px dashed #c98a3c;font-size:18px;font-weight:bold;color:#7a4a1c}
.panel .buttons{position:sticky;bottom:0;background:#fff8e8;padding:8px 0;margin-top:12px}
.app{overflow:clip}
/* Villaggio per bambini: schermo basso (telefono in orizzontale), Fiocco a sinistra e la letterina a destra */
@media (max-height:520px) and (min-aspect-ratio:4/3){body{padding:6px;height:100vh;min-height:0}.app{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);grid-template-rows:auto minmax(0,1fr) auto;height:calc(100vh - 12px);border-width:4px;border-radius:16px}.top{grid-column:1;grid-row:1;padding:6px;border-bottom-width:3px}.top h1{font-size:1.05rem}.top p{display:none}.scene{grid-column:1;grid-row:2;min-height:0;padding:10px 8px 14px;gap:6px}.scene:before{height:10px}.window{display:none}.babbo-bar{grid-column:1;grid-row:3;padding:6px}.babbo-bar button.action{padding:8px 12px;font-size:15px}.steps{grid-column:2;grid-row:1;padding:6px;gap:4px}.step{padding:3px 8px;font-size:12px}.panel{grid-column:2;grid-row:2/4;overflow:auto;padding:8px 12px 0;min-height:0}.panel h2{font-size:1.1rem;margin:2px 0 6px}.hint{font-size:.95rem;margin:4px}.choices{gap:8px;margin:6px auto}.choice{min-width:84px;padding:6px;font-size:14px}.choice .emoji{font-size:34px}.sticker{font-size:28px;padding:4px}.paper{font-size:15px;padding:10px;min-height:0;margin:6px auto}.stickers{font-size:26px}.big{font-size:44px}.status{font-size:18px}.nota-gentile{font-size:15px;padding:8px 12px}button.action{padding:10px 16px;font-size:16px}.foot{display:none}.elf{width:clamp(70px,13vw,120px)}.fiocco-svg{max-height:140px}.mailbox{font-size:60px}.desk{min-height:80px;width:38%}.desk .letter{font-size:42px}.desk small{font-size:12px}.elf-name{display:none}}
/* Villaggio per bambini: con "riduci movimento" le animazioni si fermano */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style></head><body><main class="app"><header class="top"><h1>📮 Ufficio Postale del Villaggio Incantato</h1><p>Aiutiamo Fiocco a spedire una letterina a Babbo Natale!</p></header><section class="scene"><div class="window"></div><div class="elf" role="img" aria-label="Fiocco, il simpatico elfo postino che saluta"><svg class="fiocco-svg" viewBox="0 0 240 310" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="coat" x2="1" y2="1"><stop stop-color="#64b66a"/><stop offset="1" stop-color="#126b4b"/></linearGradient><linearGradient id="skin" x2="1" y2="1"><stop stop-color="#ffe4bd"/><stop offset="1" stop-color="#efad83"/></linearGradient><linearGradient id="hat" x2="1" y2="1"><stop stop-color="#e9454c"/><stop offset="1" stop-color="#9b1836"/></linearGradient><radialGradient id="faceGlow"><stop stop-color="#fff0d5"/><stop offset="1" stop-color="#f6c398"/></radialGradient></defs><ellipse cx="115" cy="297" rx="78" ry="11" fill="#5a321c" opacity=".24"/><path d="M62 265 Q47 288 43 294 Q71 309 103 293 L105 263Z" fill="#522f32"/><path d="M136 263 Q143 288 165 295 Q196 299 200 284 L172 259Z" fill="#522f32"/><path d="M67 189 Q33 210 37 274 Q114 294 188 274 Q193 219 164 189Z" fill="url(#coat)" stroke="#215c3b" stroke-width="5"/><path d="M80 213 L119 263 L158 213" fill="none" stroke="#f5d48c" stroke-width="6"/><circle cx="119" cy="253" r="7" fill="#e7b749"/><path d="M62 204 Q30 202 22 236" stroke="#217447" stroke-width="24" stroke-linecap="round" fill="none"/><ellipse cx="19" cy="237" rx="16" ry="18" fill="url(#skin)"/><g class="wave"><path d="M171 204 Q205 183 213 158" stroke="#23804c" stroke-width="25" stroke-linecap="round" fill="none"/><path d="M209 165 Q198 154 198 141 Q198 132 206 134 L215 149 L214 122 Q215 114 223 120 L226 145 Q232 131 237 137 Q244 145 232 171 Q225 183 212 182Z" fill="url(#skin)" stroke="#eaa47c" stroke-width="2"/></g><path d="M75 182 Q116 197 163 182 L174 203 Q116 223 63 203Z" fill="#d73c4b"/><path d="M80 199 Q116 210 164 198" stroke="#f7b6a3" stroke-width="4" fill="none"/><path d="M46 118 Q20 100 17 128 Q20 157 52 159" fill="url(#skin)" stroke="#dd9975" stroke-width="3"/><path d="M185 118 Q214 100 216 128 Q211 156 182 159" fill="url(#skin)" stroke="#dd9975" stroke-width="3"/><ellipse cx="116" cy="129" rx="78" ry="77" fill="url(#faceGlow)" stroke="#e9a779" stroke-width="3"/><path d="M46 116 Q40 65 83 58 Q119 34 161 61 Q192 79 185 118 Q173 86 154 88 Q136 66 110 88 Q80 73 46 116Z" fill="#8c4a28"/><path d="M67 87 Q94 65 107 81 M116 78 Q138 61 159 83" fill="none" stroke="#b87542" stroke-width="10" stroke-linecap="round"/><ellipse cx="83" cy="130" rx="16" ry="23" fill="white"/><ellipse cx="150" cy="130" rx="16" ry="23" fill="white"/><ellipse cx="88" cy="134" rx="9" ry="15" fill="#50382c"/><ellipse cx="146" cy="134" rx="9" ry="15" fill="#50382c"/><circle cx="91" cy="127" r="4" fill="white"/><circle cx="149" cy="127" r="4" fill="white"/><ellipse cx="117" cy="157" rx="11" ry="9" fill="#efae87"/><path d="M97 170 Q117 192 139 170" fill="none" stroke="#9a4c48" stroke-width="5" stroke-linecap="round"/><ellipse cx="68" cy="160" rx="13" ry="7" fill="#e98c86" opacity=".55"/><ellipse cx="166" cy="160" rx="13" ry="7" fill="#e98c86" opacity=".55"/><g fill="#c87a5b"><circle cx="67" cy="150" r="2"/><circle cx="76" cy="156" r="2"/><circle cx="163" cy="150" r="2"/><circle cx="171" cy="157" r="2"/></g><path d="M38 100 Q37 30 95 14 Q148 -2 185 39 Q194 49 209 40 Q215 62 190 70 Q159 50 133 57 Q77 51 38 100Z" fill="url(#hat)" stroke="#a51d36" stroke-width="4"/><path d="M39 92 Q105 46 183 78" fill="none" stroke="#fff4df" stroke-width="19" stroke-linecap="round"/><circle cx="211" cy="48" r="16" fill="#fff3dc"/><path d="M47 248 Q119 271 186 247" fill="none" stroke="#a0d6a1" stroke-width="3" opacity=".6"/></svg><span class="elf-name">Fiocco, il postino ✉️</span></div><div class="desk"><span id="sceneLetter" class="letter">✉️</span><small id="sceneCaption">La tua letterina</small></div><div class="mailbox" id="mailbox" title="Cassetta della posta">📮</div></section><div class="babbo-bar" id="babboBar" hidden><button class="action" onclick="leggiBabbo()">📜 La letterina di Babbo Natale</button></div><div class="steps" id="steps"></div><section class="panel" id="panel" aria-live="polite"></section><footer class="foot">🎄 Una piccola magia da portare nel Villaggio Incantato 🎄</footer></main><script>
const KEY='villaggio_postale_v1';let data={step:0,wishes:[],message:'',stickers:[],sent:false};try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&typeof d.step==='number')data={...data,...d}}catch(e){}const gifts=[['🧸','Orsetto'],['🚂','Trenino'],['⚽','Pallone'],['🎨','Colori'],['🪁','Aquilone'],['📚','Libri']];const deco=['⭐','❤️','🎄','❄️','🎁','🌟'];function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}function btn(t,fn,cl='action'){return `<button class="${cl}" onclick="${fn}">${t}</button>`}function letter(){return `<div class="paper"><b>Caro Babbo Natale,</b><p>quest'anno mi piacerebbe ricevere: <b>${data.wishes.map(w=>gifts.find(x=>x[1]===w)?.[0]+' '+w).join(', ')||'un po’ di magia'}</b>.</p>${data.message?`<p>${escapeHtml(data.message)}</p>`:''}<div class="stickers">${data.stickers.join(' ')}</div><p>Con affetto ❤️</p></div>`}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(n){data.step=n;save();render()}function choose(w){data.wishes=data.wishes.includes(w)?data.wishes.filter(x=>x!==w):[...data.wishes,w];save();render()}function decorate(e){data.stickers.push(e);if(data.stickers.length>9)data.stickers.shift();save();render()}function updateMessage(v){data.message=v;save()}function send(){data.sent=true;data.step=4;save();if(inVillaggio){coda.push({id:String(Date.now()),testo:testoLettera()});salvaCoda();fallita=false;spedisciCoda()}const l=document.getElementById('sceneLetter');l.classList.add('fly');setTimeout(render,550)}function reset(){document.getElementById('panel').innerHTML=`<h2>Vuoi preparare una nuova letterina?</h2><div class="buttons">${btn('No, resto qui','render()','secondary')}${btn('Sì, una nuova letterina ✉️','nuova()')}</div>`}function nuova(){data={step:0,wishes:[],message:'',stickers:[],sent:false};save();render()}function render(){document.getElementById('steps').innerHTML=['🎁 Scegli','🎨 Decora','✉️ Prepara','📮 Imbuca','🧝 In viaggio'].map((s,i)=>`<span class="step ${data.step===i?'on':''}">${i+1}. ${s}</span>`).join('');document.getElementById('sceneLetter').className='letter';document.getElementById('sceneLetter').textContent=data.sent?'💌':data.step>=2?'✉️':'📜';document.getElementById('sceneCaption').textContent=data.sent?'Spedita al Polo Nord!':'La tua letterina';const p=document.getElementById('panel');if(data.step===0){p.innerHTML=`<h2>🎁 Cosa vorresti chiedere a Babbo Natale?</h2><p class="hint">Tocca uno o più giocattoli!</p><div class="choices">${gifts.map(([e,w])=>`<button class="choice ${data.wishes.includes(w)?'selected':''}" onclick="choose('${w}')"><span class="emoji">${e}</span>${w}</button>`).join('')}</div><div class="buttons">${btn('Avanti: decoriamo! 🎨','go(1)')}</div>`}else if(data.step===1){p.innerHTML=`<h2>🎨 Decoriamo la letterina!</h2><p class="hint">Aggiungi stelle, cuori e decorazioni. Puoi anche scrivere un pensiero.</p>${letter()}<div class="choices">${deco.map(e=>`<button class="sticker" onclick="decorate('${e}')">${e}</button>`).join('')}</div><div style="max-width:550px;margin:auto"><textarea aria-label="Un pensiero per Babbo Natale" placeholder="Un pensiero per Babbo Natale (facoltativo)" rows="2" style="width:100%;font:inherit" oninput="updateMessage(this.value)">${escapeHtml(data.message)}</textarea></div><div class="buttons">${btn('Indietro','go(0)','secondary')}${btn('La letterina è pronta! ✉️','go(2)')}</div>`}else if(data.step===2){p.innerHTML=`<h2>✉️ Prepariamo la busta!</h2>${letter()}<p class="hint">Fiocco piega la letterina e la mette in una bella busta!</p><span class="big">💌</span><div class="buttons">${btn('Indietro','go(1)','secondary')}${btn('Andiamo alla cassetta! 📮','go(3)')}</div>`}else if(data.step===3){p.innerHTML=`<h2>📮 Imbuchiamo la letterina!</h2><p class="hint">Tocca il pulsante: la lettera volerà nella cassetta rossa!</p><span class="big">💌 ➜ 📮</span><div class="buttons">${btn('Indietro','go(2)','secondary')}${btn('Imbuca la letterina! 💌','send()')}</div>`}else{p.innerHTML=`<h2>🎉 La tua letterina è in viaggio verso Babbo Natale!</h2><p class="hint">Fiocco l'ha raccolta e l'ha messa nel suo sacco postale.</p><span class="big">🧝‍♂️ 🧺 💌 🛷</span><p class="status">Missione compiuta! ❤️</p>${notaSpedizione()}<div class="buttons">${btn('Rivedi la mia letterina 📜','go(5)','secondary')}${btn('Prepara un’altra letterina','reset()')}</div>`;if(data.step===5){p.innerHTML=`<h2>📜 La tua letterina</h2>${letter()}<div class="buttons">${btn('Torna alla festa 🎉','go(4)','secondary')}${btn('Prepara un’altra letterina','reset()')}</div>`}}}
// ===== Villaggio per bambini: la letterina parte davvero verso chi ha preparato il calendario =====
const inVillaggio=window.parent!==window;
const CODA=KEY+'_da_spedire';
let coda=[];try{const c=JSON.parse(localStorage.getItem(CODA));if(Array.isArray(c))coda=c.filter(x=>x&&typeof x.testo==='string')}catch(e){}
let inViaggio=null,timerViaggio=null,fallita=false,letteraBabbo='';
function salvaCoda(){try{localStorage.setItem(CODA,JSON.stringify(coda))}catch(e){}}
function testoLettera(){const voglio=data.wishes.map(w=>(gifts.find(x=>x[1]===w)?.[0]||'')+' '+w).join(', ')||'un po’ di magia';return 'Caro Babbo Natale,\nquest’anno mi piacerebbe ricevere: '+voglio+'.'+(data.message.trim()?'\n'+data.message.trim():'')+(data.stickers.length?'\n'+data.stickers.join(' '):'')+'\nCon affetto ❤️'}
function spedisciCoda(){if(!inVillaggio||inViaggio||!coda.length)return;inViaggio=coda[0].id;window.parent.postMessage({tipo:'lettera',id:coda[0].id,testo:coda[0].testo},'*');clearTimeout(timerViaggio);timerViaggio=setTimeout(()=>esitoSpedizione({id:inViaggio,ok:false}),12000)}
function esitoSpedizione(r){if(!inViaggio||r.id!==inViaggio)return;clearTimeout(timerViaggio);inViaggio=null;if(r.ok){coda=coda.filter(x=>x.id!==r.id);salvaCoda();fallita=false;spedisciCoda()}else fallita=true;if(data.step===4)render()}
function riprova(){fallita=false;render();spedisciCoda()}
function notaSpedizione(){if(!inVillaggio||!coda.length)return'';if(fallita)return`<p class="nota-gentile">Il postino è un po’ in ritardo: la tua letterina è al sicuro nel sacco di Fiocco 🎒 e la spediamo appena possibile.</p><div class="buttons">${btn('Riprova a spedire 📮','riprova()','secondary')}</div>`;return'<p class="hint">✉️ Fiocco sta portando la letterina…</p>'}
function leggiBabbo(){if(!letteraBabbo)return;const p=document.getElementById('panel');p.innerHTML=`<h2>📜 La letterina di Babbo Natale</h2><div class="paper carta-babbo">${escapeHtml(letteraBabbo)}</div><div class="buttons">${btn('Torna alla mia letterina ✉️','render()','secondary')}</div>`;p.scrollIntoView({block:'start',behavior:'smooth'})}
window.addEventListener('message',e=>{if(e.source!==window.parent||!e.data)return;const m=e.data;if(m.tipo==='lettera-esito')esitoSpedizione(m);if(m.tipo==='posta-dati'){letteraBabbo=typeof m.letteraBabbo==='string'?m.letteraBabbo.trim():'';document.getElementById('babboBar').hidden=!letteraBabbo}});
if(inVillaggio){window.parent.postMessage({tipo:'posta-pronta'},'*');spedisciCoda()}
render();</script></body></html>

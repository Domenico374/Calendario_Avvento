<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Il laboratorio di Fiocco</title><style>
:root{font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff6e4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 10%,#345d66,#122b39 72%);display:flex;align-items:center;justify-content:center;padding:15px}.app{width:min(100%,950px);border:7px solid #714127;border-radius:25px;overflow:hidden;box-shadow:0 22px 65px #07171dcc;background:#613b2c}.top{padding:18px 20px 8px;text-align:center;background:linear-gradient(#744a35,#563325)}h1{font-size:clamp(25px,5vw,40px);margin:0;color:#ffdd86;text-shadow:2px 3px #38231d}p{margin:7px 0 12px}.scene{height:clamp(310px,51vw,480px);position:relative;overflow:hidden;background:linear-gradient(90deg,#704c37,#a06b46 50%,#6f4837)}.scene:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 115px,#59352355 117px 123px),repeating-linear-gradient(0deg,transparent 0 112px,#ffe6b91a 114px 117px);pointer-events:none}.window{position:absolute;left:7%;top:9%;width:24%;height:37%;border:10px solid #553223;border-radius:75px 75px 12px 12px;background:linear-gradient(#183c59,#6093aa 68%,#f0f6f7 69%);box-shadow:0 0 0 4px #c79656,0 4px 18px #362218}.window:after{content:'✦  ✧  ✦';position:absolute;top:13%;left:10%;font-size:26px;color:#fff}.shelf{position:absolute;right:5%;top:9%;width:30%;height:35%;background:#573525;border:9px solid #b67d45;border-radius:8px;display:flex;align-items:center;justify-content:space-around;font-size:clamp(23px,5vw,45px)}.shelf:after{content:'';position:absolute;top:50%;width:100%;height:9px;background:#b67d45}.lamp{position:absolute;left:48%;top:-12px;font-size:50px;filter:drop-shadow(0 0 18px #ffe391)}.table{position:absolute;z-index:1;bottom:0;width:100%;height:34%;background:linear-gradient(#c18b56 0 13%,#845131 14% 100%);border-top:9px solid #e5b474;box-shadow:0 -10px 30px #2b1d1d55}.elf{position:absolute;left:4%;bottom:21%;width:23%;height:48%;transform-origin:bottom;animation:bob 3s ease-in-out infinite}.elf svg{width:100%;height:100%;filter:drop-shadow(2px 8px 5px #1e171855)}@keyframes bob{50%{transform:translateY(-5px)}}.workspace{position:absolute;z-index:4;left:31%;bottom:7%;width:48%;height:64%;display:flex;align-items:center;justify-content:center;pointer-events:none}.toy{font-size:clamp(125px,22vw,230px);filter:drop-shadow(0 10px 6px #36201666);transition:transform .5s;animation:appear .5s}.toy.pulse{animation:pop .7s}@keyframes pop{0%{transform:scale(.65) rotate(-12deg)}60%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1)}}@keyframes appear{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}.gift{position:relative;font-size:clamp(145px,23vw,235px);filter:drop-shadow(0 10px 6px #36201666);animation:pop .7s}.spark{position:absolute;inset:0;pointer-events:none;font-size:30px;color:#ffe99d;animation:shine 1s infinite alternate;text-align:center}@keyframes shine{to{transform:translateY(-20px);opacity:.4}}.sign{position:absolute;z-index:2;right:3%;bottom:29%;background:#e9c78c;color:#633b25;padding:8px 13px;transform:rotate(4deg);border:3px solid #774a2e;border-radius:5px;font-weight:bold;font-size:clamp(12px,2vw,18px)}.controls{background:#f7e9ce;color:#4e3426;padding:18px;text-align:center}.status{font-size:clamp(16px,3vw,22px);font-weight:bold;min-height:30px}.steps{display:flex;justify-content:center;gap:9px;margin:10px 0 15px}.dot{height:13px;width:13px;background:#c9b89b;border-radius:50%}.dot.on{background:#298a69}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}button{border:0;border-radius:15px;background:#247b64;color:white;font-weight:bold;font-size:clamp(15px,2.5vw,19px);padding:14px 18px;cursor:pointer;box-shadow:0 5px #15503e;min-height:54px}button:disabled{background:#c2b9a8;box-shadow:0 5px #928b7f;cursor:default}button:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px #15503e}.secondary{background:#885c41;box-shadow:0 5px #573925}.note{font-size:13px;color:#705945;margin-top:14px}.stars{position:absolute;z-index:5;left:0;top:0;right:0;bottom:0;pointer-events:none;opacity:0;background-image:radial-gradient(circle,#fff4a3 2px,transparent 4px);background-size:70px 65px;transition:opacity .3s}.stars.show{opacity:1;animation:shine .7s 2}@media(max-width:560px){.elf{left:1%;width:30%}.workspace{left:29%;width:65%;bottom:8%;height:59%}.shelf{right:2%;font-size:27px}.sign{right:1%;bottom:27%}}
 .gift-display{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%}.gift-display .gift{line-height:1}.gift-display .gift-toy{position:absolute;top:0;right:2%;font-size:clamp(55px,9vw,95px);filter:drop-shadow(0 5px 5px #36201688);transform:rotate(12deg)}.gift-display .gift-caption{position:absolute;bottom:0;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff0c9;color:#603d2a;border-radius:15px;padding:5px 13px;font-size:clamp(13px,2vw,18px);font-weight:bold;box-shadow:0 4px 10px #2b1d1d66}.toy{line-height:1.1}.scene{isolation:isolate}@media(max-width:560px){.sign{font-size:11px;bottom:30%;padding:5px}.gift-display .gift-toy{right:0;top:5%}} 
/* Regalo grande e costruzione passo passo */
.workspace{left:32%;width:54%;height:67%;bottom:5%;overflow:visible}
.package-scene{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.hero-toy{position:relative;z-index:2;font-size:clamp(105px,19vw,205px);line-height:1;animation:appear .45s both}
.empty-box{position:absolute;right:-4%;bottom:0;width:43%;height:29%;border:9px solid #c48b4b;border-top:15px solid #e2ad63;background:#a55e35;border-radius:7px;box-shadow:inset 0 9px #714125,0 9px 12px #2d1b1670;transform:rotate(-5deg)}
.present-box{position:relative;width:min(78%,245px);height:70%;max-height:245px;filter:drop-shadow(0 11px 9px #35221b88);animation:pop .6s both}
.present-body{position:absolute;left:12%;right:12%;top:26%;bottom:3%;border:5px solid #7f2e35;border-radius:6px 6px 15px 15px;background:linear-gradient(110deg,#d63e52,#f26571 45%,#bd3045)}
.present-lid{position:absolute;left:6%;right:6%;top:20%;height:25%;border:5px solid #7f2e35;border-radius:7px;background:linear-gradient(#fa8190,#d84759);z-index:2}
.toy-peek{position:absolute;z-index:3;top:-11%;left:50%;transform:translateX(-50%);font-size:clamp(72px,12vw,126px);animation:appear .4s both;line-height:1}
.ribbon-vertical{position:absolute;z-index:4;top:20%;bottom:3%;left:45%;width:11%;background:linear-gradient(90deg,#f5c04d,#ffed95,#e8a62e);box-shadow:0 0 2px #8b4e17}
.ribbon-horizontal{position:absolute;z-index:5;top:27%;height:12%;left:6%;right:6%;background:linear-gradient(#ffec93,#efb13d)}
.big-bow{position:absolute;z-index:7;left:50%;top:-26%;transform:translateX(-50%);font-size:clamp(105px,15vw,155px);line-height:1;filter:drop-shadow(0 5px 3px #4d242b80);animation:bow-in .65s both}
@keyframes bow-in{from{opacity:0;transform:translateX(-50%) scale(.2) rotate(-25deg)}65%{transform:translateX(-50%) scale(1.2) rotate(8deg)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.sleigh{position:absolute;z-index:1;bottom:-11%;right:-19%;font-size:clamp(55px,9vw,100px);animation:appear .6s both}
.celebration{position:absolute;z-index:8;top:-12%;font-size:40px;animation:shine .9s infinite alternate}
@media(max-width:560px){.workspace{left:29%;width:68%;height:61%;bottom:7%}.hero-toy{font-size:clamp(110px,28vw,170px)}.present-box{height:65%;width:76%}.big-bow{font-size:clamp(90px,22vw,125px)}.sign{z-index:1;bottom:29%}}

/* La slitta occupa la scena: il pacco resta ben visibile sopra il pianale */
.sleigh-stage{position:relative;width:min(100%,440px);height:100%;min-height:195px;isolation:isolate;animation:appear .45s both}
.sleigh-art{position:absolute;left:4%;right:3%;bottom:2%;height:48%;filter:drop-shadow(0 9px 7px #2b1a1766)}
.sleigh-seat{position:absolute;left:13%;right:10%;bottom:24%;height:60%;background:linear-gradient(130deg,#b82332,#e33e43 60%,#8d1826);border:7px solid #f3c76e;border-radius:16px 18px 65px 55px;box-shadow:inset 0 -12px #7b1527}
.sleigh-back{position:absolute;left:7%;bottom:31%;width:21%;height:90%;background:linear-gradient(90deg,#7f1727,#d33340);border:7px solid #f2c66c;border-radius:50% 48% 10px 10px;transform:rotate(-10deg)}
.sleigh-front{position:absolute;right:1%;bottom:22%;width:23%;height:62%;border-right:12px solid #e8b84e;border-top:11px solid #f3cf79;border-radius:0 85% 12% 0;transform:rotate(8deg)}
.sleigh-runner{position:absolute;left:5%;right:1%;bottom:4%;height:22%;border-bottom:11px solid #e8b84e;border-right:10px solid #e8b84e;border-radius:0 0 70% 45%;transform:skewX(-10deg)}
.loaded-gift{position:absolute;z-index:5;left:37%;top:-3%;width:44%;height:64%;max-height:none;transform:rotate(-6deg) scale(.82);transform-origin:center bottom;animation:load-in .8s both}
.loaded-gift .big-bow{font-size:clamp(75px,11vw,118px)}
@keyframes load-in{from{opacity:0;transform:translateY(-60px) rotate(-12deg) scale(.7)}to{opacity:1;transform:translateY(0) rotate(-6deg) scale(.82)}}
.sleigh-stage.ready{animation:sleigh-happy 1.3s ease-in-out 1}
@keyframes sleigh-happy{40%{transform:translateY(-12px)}70%{transform:translateY(2px)}}
@media(max-width:560px){.sleigh-stage{min-height:170px}.loaded-gift{left:33%;width:51%;top:1%;height:59%}.loaded-gift .big-bow{font-size:75px}}

/* Villaggio per bambini: schermo basso (telefono in orizzontale), il laboratorio a sinistra e i pulsanti a destra */
@media (max-height:520px) and (min-aspect-ratio:4/3){body{padding:6px;min-height:0;height:100vh;align-items:stretch}.app{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(220px,1fr);grid-template-rows:auto minmax(0,1fr);height:calc(100vh - 12px);border-width:4px;border-radius:16px}.top{grid-column:2;grid-row:1;padding:8px}.top h1{font-size:1.2rem}.top p{display:none}.scene{grid-column:1;grid-row:1/3;height:100%}.controls{grid-column:2;grid-row:2;padding:8px 10px;overflow:auto;display:flex;flex-direction:column;justify-content:center}.status{font-size:1rem}.steps{margin:6px 0 8px}.buttons{flex-direction:column;gap:8px}.buttons button{min-height:44px;padding:8px 12px;font-size:1rem}.note{display:none}}

/* Villaggio per bambini: con "riduci movimento" le animazioni si fermano */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style></head><body><main class="app"><header class="top"><h1>🎄 Il laboratorio di Fiocco</h1><p>Scegli un giocattolo, mettilo nella scatola e prepara il fiocco e caricalo sulla slitta!</p></header><section class="scene" aria-label="Laboratorio natalizio illustrato"><div class="window"></div><div class="lamp">💡</div><div class="shelf">🪀 🧸 🚂</div><div class="elf" aria-label="Fiocco, l'elfo"><svg viewBox="0 0 190 290" xmlns="http://www.w3.org/2000/svg"><ellipse cx="95" cy="278" rx="55" ry="9" fill="#39241e" opacity=".4"/><path d="M60 217 L54 272 81 272 95 233 108 272 137 272 128 211" fill="#315b4b"/><path d="M50 266q-30 0-29 16h62v-16M110 266q0 16 57 16 1-16-28-16" fill="#6a302b"/><path d="M54 148 Q95 120 136 148 L145 225 Q95 243 45 225Z" fill="#23735b" stroke="#124b3d" stroke-width="5"/><path d="M48 156 Q12 170 28 212 L45 212 68 178M138 157 Q172 175 156 215 L137 212 120 179" fill="#23735b" stroke="#124b3d" stroke-width="5"/><circle cx="33" cy="216" r="16" fill="#f7c7a0"/><circle cx="154" cy="216" r="16" fill="#f7c7a0"/><path d="M62 145L95 170 127 145" fill="none" stroke="#f8dfaa" stroke-width="13"/><circle cx="95" cy="195" r="7" fill="#f9d57c"/><ellipse cx="95" cy="95" rx="60" ry="65" fill="#f6c9a7"/><path d="M41 99 Q13 105 37 125 L50 112M149 99 Q176 105 153 125L139 112" fill="#f6c9a7"/><path d="M38 85 Q35 33 95 32 Q156 34 152 87 L135 63 115 72 91 58 65 75Z" fill="#7d472c"/><ellipse cx="73" cy="104" rx="9" ry="12" fill="#302b2a"/><ellipse cx="118" cy="104" rx="9" ry="12" fill="#302b2a"/><circle cx="76" cy="99" r="3" fill="white"/><circle cx="121" cy="99" r="3" fill="white"/><ellipse cx="95" cy="119" rx="8" ry="6" fill="#e8a482"/><path d="M78 133Q95 147 112 133" stroke="#a35346" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M35 66 Q65 -20 123 9 Q149 17 153 38 Q115 25 35 66" fill="#b73737" stroke="#842727" stroke-width="5"/><circle cx="154" cy="37" r="17" fill="#fff2d9"/><path d="M42 67 Q93 47 148 65" stroke="#fff2d9" stroke-width="17" fill="none" stroke-linecap="round"/></svg></div><div class="workspace" id="workspace" aria-live="polite"></div><div class="sign">Officina dei sogni ✨</div><div class="table"></div><div class="stars" id="stars"></div></section><section class="controls"><div class="status" id="status"></div><div class="steps" aria-label="Progressi"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="buttons" id="buttons"></div><div class="note">I progressi vengono salvati solo su questo browser. Nessun dato viene inviato online.</div></section></main><script>
(()=>{'use strict';
const KEY='villaggio-fiocco-laboratorio-v2';
let state={step:0,toy:'🧸'};
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Number.isInteger(saved.step)&&saved.step>=0&&saved.step<=5&&['🧸','🚂','🪀'].includes(saved.toy))state=saved}catch{}
const w=document.getElementById('workspace'),status=document.getElementById('status'),buttons=document.getElementById('buttons'),stars=document.getElementById('stars');
const msgs=['Scegli il giocattolo per il regalo!','Prepariamo il regalo! Mettiamo il giocattolo nella scatola.','Il giocattolo è dentro la scatola! Ora aggiungiamo il fiocco.','Il fiocco è al suo posto! Ora portiamolo alla slitta.','Mettiamo il regalo sulla slitta di Babbo Natale!','Eccolo! Il regalo è sulla slitta, pronto per partire! 🛷'];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function button(label,fn,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.addEventListener('click',fn);buttons.appendChild(b)}
function next(){state.step++;save();render()}
function el(tag,cls,txt){const e=document.createElement(tag);e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function render(){
status.textContent=msgs[state.step];buttons.replaceChildren();document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i<state.step));stars.classList.toggle('show',state.step===5);w.replaceChildren();
const display=el('div','package-scene');w.appendChild(display);
if(state.step===0){display.appendChild(el('div','toy hero-toy','🧸'));[['🧸 Orsetto','🧸'],['🚂 Trenino','🚂'],['🪀 Trottola','🪀']].forEach(([name,emoji])=>button(name,()=>{state.toy=emoji;next()}));return}
if(state.step===1){display.appendChild(el('div','toy hero-toy',''+state.toy));display.appendChild(el('div','empty-box',''));button('📦 Metti nella scatola',next);return}
const gift=el('div','present-box');
gift.appendChild(el('div','present-body'));
if(state.step===2){gift.appendChild(el('div','present-lid'));button('🎀 Aggiungi il fiocco',next)}
if(state.step>=3){gift.appendChild(el('div','present-lid'));gift.appendChild(el('div','ribbon-vertical'));gift.appendChild(el('div','ribbon-horizontal'));gift.appendChild(el('div','big-bow','🎀'));if(state.step===3)button('🛷 Andiamo alla slitta!',next)}
display.appendChild(gift);
if(state.step>=4){display.replaceChildren();const sled=el('div','sleigh-stage');const sleigh=el('div','sleigh-art');sleigh.innerHTML='<div class="sleigh-back"></div><div class="sleigh-seat"></div><div class="sleigh-front"></div><div class="sleigh-runner"></div>';const loaded=gift.cloneNode(true);loaded.classList.add('loaded-gift');sled.append(sleigh,loaded);display.appendChild(sled);if(state.step===4){button('🎁 Mettiamolo nella slitta',next)}else{sled.classList.add('ready');display.appendChild(el('div','celebration','✨ ✦ ✨'));button('🎄 Prepara un altro regalo',()=>{state.step=0;save();render()},'secondary')}}
}
render();
})();
</script></body></html>
